name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificação de tipos
        run: npm run typecheck
      - name: Testes (autenticação, autorização, critérios de aceitação)
        run: npm test
      - name: Build de produção
        run: npx vite build && npx tsc -p tsconfig.server.json
      - name: Dependências com vulnerabilidades altas ou críticas
        run: npm audit --omit=dev --audit-level=high
